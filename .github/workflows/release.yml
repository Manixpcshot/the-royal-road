name: Release Royal Road
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: python3 scripts/package.py
      - name: Test extracted hosting builds in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund playwright-core@1.56.1
          mkdir -p "$RUNNER_TEMP/static/game" "$RUNNER_TEMP/vps"
          unzip -q dist/*cpanel*.zip -d "$RUNNER_TEMP/static/game"
          unzip -q dist/*vps*.zip -d "$RUNNER_TEMP/vps"
          node "$RUNNER_TEMP/vps/server.mjs" &
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/static" &
          NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" node scripts/browser-smoke.cjs
      - name: Publish versioned deployment archives
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$version" = "$GITHUB_REF_NAME"; fi
          if gh release view "$version" >/dev/null 2>&1; then exit 0; fi
          gh release create "$version" dist/*.zip --target "$GITHUB_SHA" --title "شاهراه · The Royal Road $version" --notes "Scout, Classic and Siege campaigns; live route planning, rival forecasts, campaign chronicle and command undo. Separate cPanel and Node.js VPS builds."
        env:
          GH_TOKEN: ${{ github.token }}
